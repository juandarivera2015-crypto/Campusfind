groups:
  - name: campusfind
    rules:
      - alert: ServiceDown
        expr: up{job=~"campusfind-.*|mysql"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="campusfind-api",status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="campusfind-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API 5xx error rate above 5%"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="campusfind-api"}[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 500 ms"

      - alert: BruteForceSuspected
        expr: sum(rate(campusfind_login_attempts_total{result="failure"}[5m])) * 60 > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 30 failed logins per minute"

      - alert: RefreshTokenReuse
        expr: increase(campusfind_refresh_token_reuse_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Refresh token replay detected (possible token theft)"
