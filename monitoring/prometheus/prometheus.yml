global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { project: campusfind }

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: campusfind-api          # Express (prom-client)
    metrics_path: /metrics
    static_configs: [{ targets: ['api:3000'] }]

  - job_name: campusfind-stats        # Django (django-prometheus)
    metrics_path: /metrics
    static_configs: [{ targets: ['stats:8000'] }]

  - job_name: mysql
    static_configs: [{ targets: ['mysqld-exporter:9104'] }]

  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
