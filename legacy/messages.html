<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner-cf"></div>
  </div>

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-expand-lg navbar-campusfind sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon">🔍</span>
        CampusFind
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="report.html">Report Object</a></li>
          <li class="nav-item"><a class="nav-link active" href="messages.html">Messages</a></li>
        </ul>
        <div id="nav-auth" class="d-flex gap-2">
          <a href="login.html"    class="btn-nav-outline">Log In</a>
          <a href="register.html" class="btn-nav-solid">Sign Up</a>
        </div>
        <div id="nav-user" class="d-flex align-items-center gap-3" style="display:none!important">
          <span style="color:rgba(255,255,255,0.85);font-size:0.875rem;font-weight:600;">
            👋 <span id="nav-user-name"></span>
          </span>
          <button id="logout-btn" class="btn-nav-outline">Log Out</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Page Header ── -->
  <div style="background:linear-gradient(90deg,var(--primary-dark),var(--primary));padding:2.5rem 0;">
    <div class="container">
      <h2 style="color:#fff;font-family:'Raleway',sans-serif;font-weight:900;margin:0;">
        📬 My Inbox
      </h2>
      <p style="color:rgba(255,255,255,0.8);margin:0.4rem 0 0;font-size:0.95rem;">
        Messages from other students about your posted items.
      </p>
    </div>
  </div>

  <!-- ── Main ── -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div id="messages-container">
          <div class="text-center py-5">
            <div class="spinner-cf mx-auto"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="footer-cf">
    <div class="container">
      <div class="footer-bottom text-center">
        &copy; 2024 CampusFind — University Lost &amp; Found System
