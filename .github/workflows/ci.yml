# Continuous Integration — runs on every push / PR of the GitFlow branches.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Express + Sequelize)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-coverage, path: backend/coverage }

  stats:
    name: Stats service (Django)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: stats-service } }
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-only-secret
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: stats-service/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: pip install -r requirements-mysql.txt pip-audit
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test -v 2
      - run: pip-audit -r requirements-mysql.txt

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm test
      - run: npm run build

  postgres:
    name: Postgres compatibility (Neon target)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: campusfind, POSTGRES_PASSWORD: campusfind, POSTGRES_DB: campusfind }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campusfind" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campusfind:campusfind@localhost:5432/campusfind
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-123456
      DJANGO_SECRET_KEY: ci-only-secret
      NODE_ENV: production
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Migrations + seed on Postgres
        working-directory: backend
        run: |
          npm install
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed:all
      - name: Smoke test API on Postgres (case-insensitive search)
        working-directory: backend
        run: |
          node src/server.js & sleep 5
          curl -fsS localhost:3000/health/ready
          test "$(curl -fsS 'localhost:3000/api/v1/objects?keyword=BACKPACK' | python3 -c 'import sys,json;print(json.load(sys.stdin)["total"])')" -ge 1
      - name: Smoke test Django on Postgres
        working-directory: stats-service
        run: |
          pip install -r requirements.txt
          python manage.py check
          DJANGO_ALLOWED_HOSTS=localhost python manage.py runserver 8000 & sleep 5
          curl -fsS localhost:8000/api/stats/summary | tee /dev/stderr | python3 -c 'import sys,json;assert json.load(sys.stdin)["total"]>=2'

  iac:
    name: IaC lint (Terraform, Kubernetes, Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - run: cd terraform/aws && terraform init -backend=false && terraform validate
      - name: Render & validate Kubernetes manifests
        run: |
          cp k8s/overlays/local/secrets.env.example k8s/overlays/local/secrets.env
          for o in local aws; do kubectl kustomize k8s/overlays/$o > /tmp/$o.yaml; done
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/local.yaml /tmp/aws.yaml
      - run: ./scripts/generate-secrets.sh && docker compose -f docker-compose.yml config -q

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: trivy.sarif }

  e2e:
    name: API contract tests (Postman/Newman + AI cases)
    runs-on: ubuntu-latest
    needs: [api, stats, web]
    steps:
      - uses: actions/checkout@v4
      - name: Create throw-away secrets
        run: ./scripts/generate-secrets.sh
      - name: Start the stack
        run: |
          cp docker-compose.override.example.yml docker-compose.override.yml
          docker compose up -d --build --wait db api stats web
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Newman (Postman collection)
        run: |
          npx --yes newman@6 run postman/CampusFind.postman_collection.json \
            -e postman/CampusFind.local.postman_environment.json \
            --env-var baseUrl=http://localhost:8080 \
            --reporters cli,junit --reporter-junit-export newman-report.xml
      - name: AI-generated / baseline security cases
        run: node ai-testing/run-cases.mjs --base-url http://localhost:8080 --cases ai-testing/cases --junit ai-testing-report.xml
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color api stats web | tail -n 300
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-reports, path: '*-report.xml' }

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [api, stats, web]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: stats, context: stats-service }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: campusfind/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
