# Secrets come from AWS Secrets Manager through the External Secrets Operator,
# authenticated with IRSA (IAM Roles for Service Accounts) — no static AWS keys in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-campusfind
  annotations:
    eks.amazonaws.com/role-arn: EXTERNAL_SECRETS_ROLE_ARN
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets-campusfind }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: campusfind-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target:
    name: campusfind-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: campusfind/app, property: JWT_SECRET }
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: { key: campusfind/app, property: DJANGO_SECRET_KEY }
    - secretKey: DB_PASSWORD
      remoteRef: { key: campusfind/app, property: DB_PASSWORD }
