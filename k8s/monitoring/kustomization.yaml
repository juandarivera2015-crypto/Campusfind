# For clusters running kube-prometheus-stack (Prometheus Operator + Grafana sidecar):
#   kubectl apply -k k8s/monitoring --load-restrictor LoadRestrictionsNone
# (kubectl kustomize needs: kustomize build --load-restrictor LoadRestrictionsNone k8s/monitoring | kubectl apply -f -)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitors.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: campusfind-grafana-dashboard
    files: [../../monitoring/grafana/dashboards/campusfind-overview.json]
    options:
      disableNameSuffixHash: true
      labels: { grafana_dashboard: "1" }
