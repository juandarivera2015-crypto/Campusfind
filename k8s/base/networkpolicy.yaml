# Zero-trust networking: deny everything, then allow only the required flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: web } }
  ingress:
    - ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-and-stats-from-web-and-monitoring
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [api, stats] }
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-from-backends
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mysql } }
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [api, stats, api-migrate] }
      ports: [{ port: 3306 }]
