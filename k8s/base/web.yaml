apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: campusfind/web
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: API_HOST, value: api.campusfind.svc.cluster.local }
            - { name: STATS_HOST, value: stats.campusfind.svc.cluster.local }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: confd, mountPath: /etc/nginx/conf.d }   # rendered from the template at start-up
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: confd
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 80, targetPort: http }]
