apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: campusfind
labels:
  - pairs: { app.kubernetes.io/part-of: campusfind }
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - uploads-pvc.yaml
  - migrate-job.yaml
  - api.yaml
  - stats.yaml
  - web.yaml
  - networkpolicy.yaml
  - ingress.yaml
# No `images:` here on purpose: each overlay maps campusfind/{api,stats,web} to its registry/tag
# (local -> campusfind/*:local built by docker compose, aws -> ECR). Renaming in the base would hide
# the original names from the overlays' image transformers.
