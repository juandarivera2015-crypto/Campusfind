apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusfind
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [campusfind.local]
      secretName: campusfind-tls
  rules:
    - host: campusfind.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
